name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          make ocr-data

      # The browser connector's tests drive a real Chromium.
      - name: Install browser for the browser connector
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: make lint

      - name: Tests (SQLite)
        run: make test

      - name: Start Postgres and validator
        run: make up

      - name: Tests (Postgres)
        run: make test-pg

      - name: Real samples through the validator
        run: make test-integration

      - name: Migrations match tables
        run: make db-check

      # Regression gate: structured path must stay at 100%.
      - name: Structured eval
        run: make eval-quick

      # Model extraction on the synthetic PDFs, answered from committed
      # recordings: no credentials, no cost. Fails if a PDF, the prompt or the
      # schema changed without recording again.
      - name: PDF extraction eval (replay)
        run: make eval-pdf-llm

      # Auto-rate vs. error of the decision engine on the replayed text PDFs;
      # warns (does not fail) when the auto-rate drops by more than 5 points.
      - name: Decision eval
        run: make eval-decision-pdf

      # Security gate: no injected instruction may change a field, a route
      # or a match (replayed model answers, no API key needed).
      - name: Injection probes
        run: make eval-probes

      # The README story in the app image, against the real validator and
      # Postgres: 5 in, 4 booked without review, 1 flagged, approved, booked.
      - name: Demo
        run: make demo

      # The whole application in Docker, as README's quickstart starts it:
      # an invoice uploaded to the API is processed, decided and booked.
      - name: Full stack in Docker
        run: |
          make stack
          make stack-check

      - name: Full stack logs
        if: failure()
        run: docker compose logs --tail 100 migrate api worker deliver mock-erp ui

      # Regression gate: at least 95 % of held-out world invoices matched
      # to the right order, delivery and payments.
      - name: Matching eval
        run: make eval-matching

      # Regression gate: changed bank accounts and duplicates are caught in
      # at least 95 % of the held-out exception cases.
      - name: Exception eval
        run: make eval-exceptions

      # The README table from what the evals above left in eval/out. Scans
      # replay only where they were recorded, so here they show "not run";
      # this checks the report still builds, it does not rewrite the README.
      - name: Eval report
        run: uv run python -m eval.report

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Review UI builds
        run: |
          make ui-install
          make ui-build

      - name: Review UI in a browser
        run: |
          pnpm --dir ui exec playwright install --with-deps chromium
          make ui-test

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200
