[project]
name = "einvoice-agent"
version = "0.1.0.dev0"
description = "Turns incoming German invoices into booked, matched and checked entries."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.8.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pypdf>=5.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "reportlab>=4.2",
    "rq>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
einvoice = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
markers = ["integration: needs the validator sidecar (make up); run with make test-integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
