name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          make ocr-data

      - name: Lint
        run: make lint

      - name: Tests (SQLite)
        run: make test

      - name: Start Postgres and validator
        run: make up

      - name: Tests (Postgres)
        run: make test-pg

      - name: Real samples through the validator
        run: make test-integration

      - name: Migrations match tables
        run: make db-check

      # Regression gate: structured path must stay at 100%.
      - name: Structured eval
        run: make eval-quick

      # Model extraction on the synthetic PDFs, answered from committed
      # recordings: no credentials, no cost. Fails if a PDF, the prompt or the
      # schema changed without recording again.
      - name: PDF extraction eval (replay)
        run: make eval-pdf-llm

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Review UI builds
        run: |
          make ui-install
          make ui-build

      - name: Review UI in a browser
        run: |
          pnpm --dir ui exec playwright install --with-deps chromium
          make ui-test

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200
