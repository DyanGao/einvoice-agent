[project]
name = "einvoice-agent"
version = "0.1.0.dev0"
description = "Turns incoming German invoices into booked, matched and checked entries."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.9",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
